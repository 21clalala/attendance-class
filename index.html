<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>수업 출결</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1f2633; --mute:#6b7380; --line:#dfe3ea; --head:#f7f8fb;
  --accent:#2f5bea; --accent-soft:#e8eefe; --red:#d93036; --red-soft:#fdeced; --lock:#eceef2; --ok:#1d8a4e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121419; --card:#1b1e25; --ink:#e7e9ee; --mute:#9aa1ad; --line:#2d313b; --head:#20242c;
         --accent:#7393ff; --accent-soft:#232c45; --red:#ff6b70; --red-soft:#3a1f22; --lock:#262a33; --ok:#3ccf7d; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 110px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 4px 10px}
.top h1{font-size:19px;margin:0}
.top .sub{color:var(--mute);font-size:14px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner .per{font-size:22px;font-weight:800;color:var(--accent)}
.banner .who{font-size:20px;font-weight:700}
.banner .time{color:var(--mute);font-size:14px}
.banner.off .per{color:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin:0 4px 10px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
th{background:var(--head);font-weight:600;color:var(--mute);font-size:13px;padding:9px 6px;position:sticky;top:0;z-index:1}
td{height:44px}
td.no{width:48px;color:var(--mute)}
td.nm{text-align:left;padding-left:10px;font-weight:600;min-width:84px}
td.slot{width:140px;font-size:20px;color:var(--ink)}
th.cur{background:var(--accent);color:#fff}
td.cur{background:var(--accent-soft);font-weight:800}
td.cur.lock{background:var(--lock);color:var(--mute)}
td.cur.saved{background:var(--red-soft);color:var(--red)}
td.cur.add{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
td.cur.del{color:var(--mute);text-decoration:line-through;box-shadow:inset 0 0 0 2px var(--mute)}
td.cur.cleared{color:var(--ok);font-size:14px;font-weight:700}
td.tm{color:var(--red)}
tr.tap{cursor:pointer}
tr.tap:active td{filter:brightness(.96)}
tr.ex td{color:var(--mute);background:var(--lock)}
tr.ex td.nm::after{content:" 제외";font-size:11px;font-weight:400}
.kd{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:700;vertical-align:1px;white-space:nowrap}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;vertical-align:1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-weight:700;font-size:16px}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.count .big{font-size:15px;font-weight:700}
.count .big b{font-size:28px;color:var(--accent);margin:0 2px}
.count .detail{color:var(--mute);font-size:14px}
.bar .now{font-weight:800;color:var(--accent);white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--accent);color:#fff;padding:13px 26px;font-weight:700;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.msg{max-width:520px;margin:60px auto;text-align:center;color:var(--mute);line-height:1.6}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.me{margin-left:auto;font-size:14px;color:var(--mute)}
.me b{color:var(--ink)}
.linkbtn{background:none;border:1px solid var(--line);color:var(--accent);padding:4px 10px;font-size:13px;margin-left:6px}
.pick{max-width:560px;margin:10px auto}
.pick h2{font-size:18px;margin:6px 0 6px}
.pick p{color:var(--mute);font-size:14px;margin:0 0 14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.names button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:14px 6px;font-size:16px;font-weight:700}
.names button:active{background:var(--accent-soft)}
.mine{color:var(--ink);font-weight:700}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="title">일일출석부</h1><span class="sub" id="date"></span><span class="me hidden" id="me"></span></div>
  <div class="pick hidden" id="pick"></div>
  <div id="main" class="hidden">
    <div class="banner" id="banner"></div>
    <div class="count hidden" id="count"></div>
    <p class="hint" id="hint"></p>
    <div class="tablebox"><table id="tbl"></table></div>
  </div>
  <div class="msg" id="msg">불러오는 중…</div>
</div>
<div class="bar hidden" id="bar"><div class="in">
  <div class="now" id="now"></div>
  <div class="sum" id="sum">변경 없음</div>
  <button class="btn" id="save" disabled>저장</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="config.js?v=8"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = id => document.getElementById(id);
const PARAMS = new URLSearchParams(location.search);
const KEY = PARAMS.get("k") || "";
const DEMO = PARAMS.has("demo");
const sb = supabase.createClient(ATTEND_CONFIG.SUPABASE_URL, ATTEND_CONFIG.SUPABASE_KEY,
  {auth:{persistSession:false, autoRefreshToken:false}});
const DOW = ["일","월","화","수","목","금","토"];

/* ---------- 체험 모드 (?demo=1): 가짜 데이터, 저장·알림 없음 ---------- */
const DEMO_STATE = (() => {
  const today = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Seoul"}).format(new Date());
  const names = ["김가람","이나래","박다온","최라온","정마루","강바다","조새봄","윤아라","임하늘","한별","오솔","서누리"];
  return {date: today, label: "체험", period: 3, teacher: "홍길동", next: null,
    schedule: [{period:3, start:"10:50", end:"11:40", teacher:"홍길동"}],
    students: names.map((name, i) => ({no: i + 1, name, excluded: false, tag: i === 7 ? "자습반" : null})),
    neis: [{no: 4, slot: "3"}], days: [{no: 4, kind: "질병결석"}], marks: [], teachers: ["홍길동"]};
})();
async function rpc(name, a){
  if(!DEMO) return sb.rpc(name, a);
  const st = DEMO_STATE;
  if(name === "get_today") return {data: JSON.parse(JSON.stringify(st))};
  const r = {period: st.period, absent: 0, present: 0, corrected: 0};
  const neis = no => st.neis.some(x => x.no === no && x.slot === String(st.period));
  const drop = (no, kind) => { const i = st.marks.findIndex(m => m.no === no && m.kind === kind); if(i >= 0){ st.marks.splice(i, 1); return true; } return false; };
  const nm = no => `${no}번 ${(st.students.find(s => s.no === no) || {}).name || ""}`;
  const L = {a: [], p: [], c: []};
  for(const no of a.p_absent){ if(neis(no)){ if(drop(no, "present")){ r.corrected++; L.c.push(nm(no) + " → 다시 없음"); } } else { st.marks.push({no, period: st.period, kind: "absent"}); r.absent++; L.a.push(nm(no)); } }
  for(const no of a.p_present){ if(neis(no)){ st.marks.push({no, period: st.period, kind: "present"}); r.present++; L.p.push(nm(no)); } else if(drop(no, "absent")){ r.corrected++; L.c.push(nm(no) + " → 출석"); } }
  // 실제 휴대폰으로 [체험] 알림 (QR 주소의 키가 있을 때만)
  if(KEY && (L.a.length || L.p.length || L.c.length)){
    const {error} = await sb.rpc("demo_notify", {p_key: KEY, p_period: st.period, p_teacher: st.teacher, p_absent: L.a, p_present: L.p, p_corrected: L.c});
    r.notified = !error;
  }
  return {data: r};
}

let S = null;              // 서버 상태
const ME_KEY = "attend-teacher";
let ME = DEMO ? "홍길동" : (() => { try{ return localStorage.getItem(ME_KEY) || ""; }catch(e){ return ""; } })();
let picking = false;
function setMe(name){ ME = name; try{ name ? localStorage.setItem(ME_KEY, name) : localStorage.removeItem(ME_KEY); }catch(e){} }
const pend = new Set();    // 이번에 누른(상태를 뒤집은) 학생 번호
let saving = false;

function toast(t, ms=2600){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"), ms); }
function fail(t){ $("main").classList.add("hidden"); $("bar").classList.add("hidden"); $("msg").classList.remove("hidden"); $("msg").innerHTML=t; }
function errText(e){
  const m = (e && (e.message||e.details)) || String(e);
  if(m.includes("invalid_key")) return "주소가 올바르지 않습니다.<br>종이 출석부의 QR 코드를 다시 찍어 주세요.";
  if(m.includes("not_in_class")||m.includes("period_changed")) return "교시가 끝나 저장되지 않았습니다. 화면을 새로 불러왔습니다.";
  if(m.includes("not_your_period")) return "선생님 수업 시간이 아니라 저장되지 않았습니다.";
  if(m.includes("no_teacher")) return S && S.period === 0 ? "담임선생님 이름이 등록되어 있지 않습니다. 관리자 페이지에서 담임 이름을 입력해 주세요." : "이 교시는 시간표에 선생님이 등록되어 있지 않습니다. 담임선생님께 알려 주세요.";
  return "연결에 문제가 있습니다. 잠시 후 다시 시도해 주세요.<br><small>"+m+"</small>";
}

async function load(){
  const {data, error} = await rpc("get_today", {p_key: KEY});
  if(error){ fail(errText(error)); return; }
  const prevPeriod = S ? S.period : undefined;
  S = data;
  if(prevPeriod !== S.period){
    if(prevPeriod !== undefined && pend.size) toast("교시가 바뀌어 저장하지 않은 변경은 취소되었습니다.", 4000);
    pend.clear();
  }
  if(!DEMO && (!ME || !(S.teachers || []).includes(ME))){ if(!picking) showPick(ME); return; }
  if(picking) return;
  render();
}

// ---------- 선생님 이름 선택 ----------
function showPick(prev){
  picking = true;
  $("main").classList.add("hidden"); $("bar").classList.add("hidden"); $("msg").classList.add("hidden");
  $("me").classList.add("hidden");
  const list = (S && S.teachers) || [];
  const el = $("pick"); el.classList.remove("hidden");
  el.innerHTML = `<h2>선생님 이름을 선택해 주세요</h2>
    <p class="prevnote"></p>
    <p>이 기기에 한 번만 저장됩니다. 저장한 선생님의 수업 시간에만 출결을 입력할 수 있습니다.</p>
    <div class="names"></div>
    <p style="margin-top:16px">목록에 이름이 없으면 담임선생님께 알려 주세요.</p>`;
  if(prev) el.querySelector(".prevnote").textContent = `저장된 이름(${prev})이 ${S.label}반 시간표에 없습니다. 이 반 수업이 맞다면 담임선생님께 시간표 등록을 요청하세요.`;
  else el.querySelector(".prevnote").remove();
  const box = el.querySelector(".names");
  if(!list.length) box.outerHTML = `<p>아직 시간표가 등록되지 않았습니다.</p>`;
  for(const name of list){
    const b = document.createElement("button"); b.textContent = name;
    b.onclick = () => {
      if(!confirm(`${name} 선생님으로 저장할까요?`)) return;
      setMe(name); picking = false; el.classList.add("hidden"); pend.clear(); render();
    };
    box.appendChild(b);
  }
}
function changeMe(){
  if(!confirm("선생님 이름을 다시 선택할까요?")) return;
  setMe(""); pend.clear(); showPick();
}

// 교시 이름 (0 = 조회)
const PL = p => p === 0 ? "조회" : p + "교시";
const hasPer = () => !!S && S.period !== null && S.period !== undefined;
const mineNow = () => hasPer() && S.teacher === ME;

// 현재 교시 기준 학생 상태
function stateOf(no){
  const cur = S.period;
  const slot = S.slot || String(cur);
  const neis = S.neis.some(x => x.no === no && x.slot === slot);
  const mk = (S.marks.find(x => x.no === no && x.period === cur) || {}).kind || null;
  const base = (neis && mk !== "present") || mk === "absent";     // 저장된 상태: 없음?
  const toggled = pend.has(no);
  return {neis, mk, base, toggled, eff: toggled ? !base : base};
}

function render(){
  $("msg").classList.add("hidden"); $("main").classList.remove("hidden");
  const d = new Date(S.date + "T00:00:00");
  $("title").textContent = `${S.label} 일일출석부`;
  $("date").textContent = `${S.date.replaceAll("-",".")}.(${DOW[d.getDay()]})`;

  const sch = S.schedule || [];
  const mineToday = sch.filter(x => x.teacher === ME);
  $("me").classList.remove("hidden");
  $("me").innerHTML = `<b></b> 선생님`;
  $("me").querySelector("b").textContent = ME;
  if(!DEMO){ const b = document.createElement("button"); b.className = "linkbtn"; b.textContent = "변경"; b.onclick = changeMe; $("me").appendChild(b); }

  const isMine = mineNow();
  const cur = isMine ? S.period : null;
  const curInfo = sch.find(x => x.period === cur);
  if(hasPer() && !isMine){
    $("banner").className = "banner off";
    $("banner").innerHTML = `<span class="per">지금은 ${PL(S.period)} · <span class="who2"></span></span><span class="time"></span>`;
    $("banner").querySelector(".who2").textContent = S.teacher ? (S.period === 0 ? `조회 시간입니다 (담임 ${S.teacher} 선생님)` : `${S.teacher} 선생님 수업 시간입니다`) : "시간표에 선생님이 등록되지 않은 시간입니다";
    $("banner").querySelector(".time").innerHTML = myPeriodsText(mineToday);
    $("hint").textContent = "선생님 수업 시간에만 출결을 입력할 수 있습니다. 교체·대강이면 담임선생님께 알려 주세요.";
    $("bar").classList.add("hidden");
  }else if(cur !== null){
    $("banner").className = "banner";
    $("banner").innerHTML = `<span class="per">${PL(cur)}</span><span class="who"></span><span class="time">${curInfo.start}~${curInfo.end}</span>`;
    $("banner").querySelector(".who").textContent = (S.teacher || "시간표 미등록") + (S.teacher ? " 선생님" : "");
    if(DEMO) $("banner").insertAdjacentHTML("beforeend", `<span class="time" style="color:var(--red);font-weight:700">체험 모드 · 출결은 저장되지 않습니다</span>`);
    $("hint").textContent = cur === 0 ? "조회 시간입니다. 없는 학생의 줄을 누르고 [저장]을 눌러 주세요. 담임 직접 입력으로 기록되며 알림은 가지 않습니다." : "없는 학생의 줄을 누르고 [저장]을 눌러 주세요. 회색 / 는 담임이 미리 표시한 학생입니다. 교실에 있으면 눌러서 해제해 주세요. 변경이 없어도 [저장]을 누르면 확인으로 기록됩니다.";
    $("bar").classList.remove("hidden");
  }else{
    $("banner").className = "banner off";
    $("banner").innerHTML = `<span class="per">지금은 수업 시간이 아닙니다</span><span class="time"></span>`;
    $("banner").querySelector(".time").innerHTML = myPeriodsText(mineToday);
    $("hint").textContent = "수업 시간에만 해당 교시를 입력할 수 있습니다.";
    $("bar").classList.add("hidden");
  }

  // 현재 교시 칸만 표시 (수업 시간이 아니면 출석부를 숨김)
  document.querySelector(".tablebox").classList.toggle("hidden", cur === null);
  if(cur === null){ $("tbl").innerHTML = ""; updateBar(); return; }
  let html = `<thead><tr><th>번호</th><th>성명</th><th class="cur">${PL(cur)}</th></tr></thead><tbody>`;
  for(const st of S.students){
    const tappable = !st.excluded;
    let cls = "slot cur", txt = "";
    if(!st.excluded){
      const s = stateOf(st.no);
      if(s.toggled){ cls += s.eff ? " add" : " del"; txt = "/"; }
      else if(s.eff){ cls += s.mk === "absent" ? " saved" : " lock"; txt = "/"; }
      else if(s.neis && s.mk === "present"){ cls += " cleared"; txt = "출석"; }
    }
    html += `<tr data-no="${st.no}" class="${st.excluded?"ex":""} ${tappable?"tap":""}"><td class="no">${st.no}</td><td class="nm"></td><td class="${cls}">${txt}</td></tr>`;
  }
  $("tbl").innerHTML = html + "</tbody>";
  $("tbl").querySelectorAll("tr[data-no]").forEach((tr, i) => {
    const nmEl = tr.querySelector(".nm");
    nmEl.textContent = S.students[i].name;
    if(S.students[i].tag){ const t = document.createElement("span"); t.className = "tag"; t.textContent = S.students[i].tag; nmEl.appendChild(t); }
    const dk = (S.days || []).find(x => x.no === S.students[i].no);   // 담임이 입력한 마감 (종류만)
    if(dk && dk.kind){ const t = document.createElement("span"); t.className = "kd"; t.textContent = dk.kind; nmEl.appendChild(t); }
    if(tr.classList.contains("tap")) tr.onclick = () => toggle(+tr.dataset.no);
  });
  updateBar();
}

function myPeriodsText(mine){
  if(!mine.length) return "오늘 이 반에 선생님 수업이 없습니다";
  return "오늘 선생님 수업: " + mine.map(x => `<span class="mine">${PL(x.period)}</span> ${x.start}`).join(", ");
}

function toggle(no){
  if(saving) return;
  pend.has(no) ? pend.delete(no) : pend.add(no);
  render();
}

// 재실 인원: 재적 - 위탁 - 자습반 - "/" (저장 전 표시 포함)
const isStudy = st => /자습/.test(st.tag || "");
function headcount(){
  const c = {enrolled: S.students.length, ex: 0, study: 0, absent: 0};
  for(const st of S.students){
    if(st.excluded){ c.ex++; continue; }
    if(isStudy(st)){ c.study++; continue; }
    if(stateOf(st.no).eff) c.absent++;
  }
  c.present = c.enrolled - c.ex - c.study - c.absent;
  return c;
}
function updateCount(){
  const on = mineNow();
  $("count").classList.toggle("hidden", !on);
  $("now").textContent = "";
  if(!on) return;
  const c = headcount();
  const parts = [`재적 ${c.enrolled}`];
  if(c.ex) parts.push(`위탁 ${c.ex}`);
  if(c.study) parts.push(`자습반 ${c.study}`);
  parts.push(`없음 ${c.absent}`);
  $("count").innerHTML = `<span class="big">재실 <b>${c.present}</b>명</span><span class="detail">${parts.join(" · ")}</span>`;
  $("now").textContent = `재실 ${c.present}명`;
}

function updateBar(){
  updateCount();
  let a = 0, p = 0;
  if(mineNow()) for(const no of pend){ stateOf(no).eff ? a++ : p++; }
  $("sum").textContent = (a||p) ? [a?`없음으로 ${a}명`:"", p?`출석으로 ${p}명`:""].filter(Boolean).join(" · ") : "변경 없음";
  $("sum").style.color = a ? "var(--red)" : "";
  $("save").disabled = saving || !mineNow();
}

$("save").onclick = async () => {
  if(saving || !mineNow()) return;
  const absent = [], present = [];
  for(const no of pend){ (stateOf(no).eff ? absent : present).push(no); }
  saving = true; updateBar(); $("save").textContent = "저장 중…";
  const {data, error} = await rpc("save_marks", {p_key: KEY, p_period: S.period, p_teacher: ME, p_absent: absent, p_present: present});
  saving = false; $("save").textContent = "저장";
  pend.clear();
  if(error){ toast(errText(error).replace(/<[^>]+>/g," "), 4000); await load(); return; }
  const parts = [];
  if(data.absent) parts.push(`없음 ${data.absent}명`);
  if(data.present) parts.push(`출석 확인 ${data.present}명`);
  if(data.corrected) parts.push(`정정 ${data.corrected}명`);
  toast(DEMO ? (parts.length ? `저장했습니다 (${parts.join(", ")}). ` + (data.notified ? "담임선생님께 [체험] 알림이 갔습니다." : "체험 모드라 알림은 보내지 않았습니다.") : "확인했습니다 (변경 없음).")
             : (parts.length ? `저장했습니다 (${parts.join(", ")}).` + (data.quiet ? "" : " 담임선생님께 알림이 갔습니다.") : "확인했습니다 (변경 없음)."));
  await load();
};

if(!KEY && !DEMO) fail("주소가 올바르지 않습니다.<br>종이 출석부의 QR 코드를 다시 찍어 주세요.");
else {
  load();
  setInterval(() => { if(!saving) load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden && !saving) load(); });
}
</script>
</body>
</html>
