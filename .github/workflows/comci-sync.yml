name: 컴시간 시간표 동기화

on:
  schedule:
    # GitHub 시간은 UTC 기준 (한국 = UTC+9)
    - cron: "10 22 * * 0-4"      # 한국 월~금 07:10 (하루 한 번)
  workflow_dispatch:              # Actions 탭에서 [Run workflow] 로 바로 실행

concurrency:
  group: comci-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "comci==0.7.0" "requests>=2.31"
      - run: python sync/comci_sync.py
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
